# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Kartikey Tanna
tagline: Software engineer. With Sweta, I make websites for local businesses.
email: tannakartikey@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Kartikey Tanna is a software engineer. He has built software for more than
  ten years, for startups and small companies, most of them in the US.
  With his wife Sweta, he makes websites for local businesses.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.kartikey.dev" # the base hostname & protocol for your site, e.g. http://example.com

author:
  name: "Kartikey Tanna"
  email: "tannakartikey@gmail.com"

social_links:
  twitter: tannakartikey
  github: tannakartikey
  linkedin: tannakartikey
  devto: tannakartikey
  stackoverflow: "2422068"
  keybase: tannakartikey

twitter:
  username: tannakartikey
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image: /assets/me-social.jpg?v=1

social:
  links:
    - https://twitter.com/tannakartikey
    - https://github.com/tannakartikey
    - https://www.linkedin.com/in/tannakartikey/
    - https://www.facebook.com/tanna.kartikeya/

disqus:
  shortname: https-www-kartikey-dev


# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-last-modified-at

header_pages:
  - websites.md
  - blog.md
  - about.md
  - faq.md

last-modified-at:
  date-format: '%b %d, %Y'

# Exclude from processing.
